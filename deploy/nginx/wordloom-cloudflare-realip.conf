# Cloudflare edge ranges (https://www.cloudflare.com/ips-v4 + ips-v6, fetched 2026-11-22).
# Include inside the wordloom server block only.
#
# Only connections from these ranges may set the client address via
# CF-Connecting-IP; anyone reaching the origin directly keeps their real
# socket address. The app keys rate limits on X-Real-IP = $remote_addr, so
# this is what makes those limits unforgeable.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
